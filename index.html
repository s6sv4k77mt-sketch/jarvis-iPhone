<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - HUD Core</title>
    <style>
        :root {
            --primary-color: #00e5ff;
            --bg-color: #030813;
            --glow-color: rgba(0, 229, 255, 0.6);
        }
        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.5s, color 0.5s;
        }
        h1 {
            font-size: 1.4rem;
            text-align: center;
            letter-spacing: 3px;
            text-shadow: 0 0 12px var(--primary-color);
            margin-bottom: 2px;
        }
        .status {
            font-size: 0.75rem;
            opacity: 0.85;
            margin-bottom: 15px;
            text-align: center;
        }
        /* Sfera Olografica 3D */
        .sphere-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .sphere {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, var(--primary-color) 0%, #000 80%);
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 30px var(--primary-color), inset 0 0 25px var(--primary-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: idlePulse 3s infinite alternate ease-in-out;
        }
        .sphere.active {
            transform: scale(1.25);
            box-shadow: 0 0 50px var(--primary-color), inset 0 0 40px var(--primary-color);
        }
        @keyframes idlePulse {
            0% { transform: scale(0.95); opacity: 0.85; }
            100% { transform: scale(1.05); opacity: 1; }
        }
        .terminal {
            width: 100%;
            max-width: 400px;
            background: rgba(0, 10, 25, 0.85);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 15px var(--glow-color);
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        #output {
            font-size: 0.85rem;
            min-height: 45px;
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .input-box {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            background: #000;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        button.action-btn {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        button.action-btn:active {
            background: var(--primary-color);
            color: #000;
        }
        .mic-btn {
            width: 100%;
            max-width: 400px;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 0 10px var(--glow-color);
        }
        .section-title {
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-top: 10px;
            margin-bottom: 5px;
            border-bottom: 1px dashed var(--primary-color);
            width: 100%;
            max-width: 400px;
            padding-bottom: 3px;
        }
    </style>
</head>
<body>

    <h1>J.A.R.V.I.S.</h1>
    <div class="status" id="battery-status">STATUS: SINCRONIZZAZIONE ENERGIA...</div>

    <!-- Sfera Olografica 3D Interattiva -->
    <div class="sphere-container" onclick="attivaAscoltoManuale()">
        <div class="sphere" id="holoSphere"></div>
    </div>

    <!-- Pulsante Rapido Microfono -->
    <button class="mic-btn" id="micBtn" onclick="avviaAscoltoVoice()">🎙️ CLICCA E PARLA A J.A.R.V.I.S.</button>

    <div class="terminal">
        <div id="output">Signore, sistemi vocali attivi. Clicca sul pulsante sopra o scrivi un comando.</div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Es. Cerca su YouTube..." onkeypress="handleKey(event)">
            <button class="action-btn" onclick="eseguiComandoTesto()">INVIA</button>
        </div>
    </div>

    <div class="section-title">METEO BOLOGNA</div>
    <div class="terminal" id="weather-box" style="font-size: 0.8rem; min-height: auto;">
        Analisi atmosfera in corso...
    </div>

    <script>
        // Sincronizzazione Batteria Dispositivo
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                updateBatteryUI(battery);
                battery.addEventListener('levelchange', function() { updateBatteryUI(battery); });
            });
        }

        function updateBatteryUI(battery) {
            const level = Math.floor(battery.level * 100);
            const statusEl = document.getElementById('battery-status');
            const root = document.documentElement;

            if (level < 20) {
                root.style.setProperty('--primary-color', '#ff3333');
                root.style.setProperty('--bg-color', '#1a0000');
                root.style.setProperty('--glow-color', 'rgba(255, 51, 51, 0.6)');
                statusEl.innerHTML = `⚠️ EMERGENZA: BATTERIA CRITICA AL ${level}%`;
            } else if (level < 40) {
                root.style.setProperty('--primary-color', '#ff9900');
                root.style.setProperty('--bg-color', '#1a0f00');
                root.style.setProperty('--glow-color', 'rgba(255, 153, 0, 0.6)');
                statusEl.innerHTML = `⚠️ ATTENZIONE: BATTERIA AL ${level}%`;
            } else {
                root.style.setProperty('--primary-color', '#00e5ff');
                root.style.setProperty('--bg-color', '#030813');
                root.style.setProperty('--glow-color', 'rgba(0, 229, 255, 0.6)');
                statusEl.innerHTML = `ENERGIA STABILE: ${level}% (ONLINE)`;
            }
        }

        // Sintesi Vocale (Parles con voce impostata su Signore)
        function parla(testo) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(testo);
                utterance.lang = 'it-IT';
                utterance.rate = 1.05;
                
                const sphere = document.getElementById('holoSphere');
                sphere.classList.add('active'); // Ingrossa la sfera mentre parla

                utterance.onend = function() {
                    sphere.classList.remove('active');
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        // Riconoscimento Vocale Reale (Microfono)
        function avviaAscoltoVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Il tuo browser non supporta il riconoscimento vocale diretto. Usa la casella di testo sotto, Signore.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            const micBtn = document.getElementById('micBtn');
            const sphere = document.getElementById('holoSphere');

            micBtn.innerText = "🔴 ASCOLTO IN CORSO...";
            sphere.classList.add('active');
            parla("La ascolto, Signore.");

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript;
                document.getElementById('userInput').value = spokenText;
                micBtn.innerText = "🎙️ CLICCA E PARLA A J.A.R.V.I.S.";
                sphere.classList.remove('active');
                processaComando(spokenText);
            };

            recognition.onerror = function() {
                micBtn.innerText = "🎙️ CLICCA E PARLA A J.A.R.V.I.S.";
                sphere.classList.remove('active');
            };

            recognition.onend = function() {
                micBtn.innerText = "🎙️ CLICCA E PARLA A J.A.R.V.I.S.";
                sphere.classList.remove('active');
            };

            recognition.start();
        }

        function attivaAscoltoManuale() {
            avviaAscoltoVoice();
        }

        function handleKey(e) {
            if (e.key === 'Enter') {
                eseguiComandoTesto();
            }
        }

        function eseguiComandoTesto() {
            const input = document.getElementById('userInput');
            processaComando(input.value);
            input.value = '';
        }

        // Logica centrale dei comandi
        function processaComando(testoGrezzo) {
            const testo = testoGrezzo.trim().toLowerCase();
            const output = document.getElementById('output');

            if (!testo) return;

            // Gestione YouTube
            if (testo.includes('youtube') || testo.includes('cerca su youtube')) {
                let query = testo.replace('cerca su youtube', '').replace('youtube', '').trim();
                if (query.length > 0) {
                    output.innerText = `Signore, reindirizzamento YouTube per: "${query}"`;
                    parla(`Subito Signore, cerco ${query} su YouTube.`);
                    setTimeout(() => {
                        window.location.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
                    }, 1800);
                } else {
                    output.innerText = "Signore, apro YouTube.";
                    parla("Apro YouTube, Signore.");
                    setTimeout(() => {
                        window.location.href = `https://www.youtube.com`;
                    }, 1500);
                }
                return;
            }

            // Risposte ironiche personalizzate
            let risposta = `Signore, ho analizzato la sua richiesta. Onestamente pensavo a qualcosa di più stimolante, ma va bene così.`;
            if (testo.includes('chi sei')) {
                risposta = "Sono J.A.R.V.I.S., il suo assistente personale. E no, non comprerò pezzi per la sua fatbike al posto suo.";
            } else if (testo.includes('ciao') || testo.includes('salve')) {
                risposta = "Bentornato Signore. Spero che la giornata sia produttiva quanto le mie analisi.";
            } else if (testo.includes('batteria')) {
                navigator.getBattery().then(b => {
                    const pct = Math.floor(b.level * 100);
                    parla(`Il sistema indica che la batteria è al ${pct} percento, Signore.`);
                });
                return;
            }

            output.innerText = risposta;
            parla(risposta);
        }

        // Meteo Bologna reale
        fetch('https://api.open-meteo.com/v1/forecast?latitude=44.4949&longitude=11.3426&current_weather=true')
            .then(res => res.json())
            .then(data => {
                const temp = data.current_weather.temperature;
                const vento = data.current_weather.windspeed;
                document.getElementById('weather-box').innerHTML = `Bologna: ${temp}°C | Vento: ${vento} km/h. Atmosfera stabile, Signore.`;
            })
            .catch(() => {
                document.getElementById('weather-box').innerHTML = `Bologna: Connessione meteo attiva, Signore.`;
            });
    </script>
</body>
</html>
