<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - HUD</title>
    <style>
        :root {
            --primary-color: #00e5ff;
            --bg-color: #030813;
            --text-glow: 0 0 10px rgba(0, 229, 255, 0.6);
        }
        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.5s, color 0.5s;
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: var(--text-glow);
            margin-bottom: 5px;
        }
        .status {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-bottom: 20px;
        }
        .reactor-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 20px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reactor {
            width: 100px;
            height: 100px;
            border: 4px solid var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--primary-color), inset 0 0 20px var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite alternate;
        }
        .core {
            width: 40px;
            height: 40px;
            background-color: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--primary-color);
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }
        .terminal {
            width: 100%;
            max-width: 400px;
            background: rgba(0, 10, 25, 0.8);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        #output {
            font-size: 0.9rem;
            min-height: 50px;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .input-box {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            background: #000;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
        }
        button.action-btn {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            transition: 0.2s;
        }
        button.action-btn:active {
            background: var(--primary-color);
            color: #000;
        }
        .section-title {
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-top: 15px;
            margin-bottom: 5px;
            border-bottom: 1px dashed var(--primary-color);
            width: 100%;
            max-width: 400px;
            padding-bottom: 3px;
        }
    </style>
</head>
<body>

    <h1>J.A.R.V.I.S.</h1>
    <div class="status" id="battery-status">STATUS: ANALISI ENERGIA...</div>

    <div class="reactor-container" onclick="parlaJarvisIniziale()">
        <div class="reactor">
            <div class="core"></div>
        </div>
    </div>

    <div class="terminal">
        <div id="output">Signore, sistemi operativi online. Clicca sul reattore o scrivi un comando.</div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Es. Cerca su YouTube calisthenics..." onkeypress="handleKey(event)">
            <button class="action-btn" onclick="eseguiComando()">INVIA</button>
        </div>
    </div>

    <div class="section-title">METEO LOCALE</div>
    <div class="terminal" id="weather-box" style="font-size: 0.85rem; min-height: auto;">
        Caricamento dati atmosferici da Bologna...
    </div>

    <script>
        // Gestione Batteria e Colori Dinamici
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                updateBatteryUI(battery);
                battery.addEventListener('levelchange', function() { updateBatteryUI(battery); });
            });
        }

        function updateBatteryUI(battery) {
            const level = Math.floor(battery.level * 100);
            const statusEl = document.getElementById('battery-status');
            const root = document.documentElement;

            if (level < 20) {
                root.style.setProperty('--primary-color', '#ff3333');
                root.style.setProperty('--bg-color', '#1a0000');
                statusEl.innerHTML = `⚠️ EMERGENZA: BATTERIA CRITICA AL ${level}%`;
            } else if (level < 40) {
                root.style.setProperty('--primary-color', '#ff9900');
                root.style.setProperty('--bg-color', '#1a0f00');
                statusEl.innerHTML = `⚠️ ATTENZIONE: BATTERIA AL ${level}%`;
            } else {
                root.style.setProperty('--primary-color', '#00e5ff');
                root.style.setProperty('--bg-color', '#030813');
                statusEl.innerHTML = `ENERGIA STABILE: ${level}% (ONLINE)`;
            }
        }

        // Sintesi Vocale (Parles)
        function parla(testo) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Ferma eventuali voci precedenti
                const utterance = new SpeechSynthesisUtterance(testo);
                utterance.lang = 'it-IT';
                utterance.rate = 1.0; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function parlaJarvisIniziale() {
            const frasi = [
                "Signore, toccare il mio reattore non velocizzerà le cose, ma apprezzo l'entusiasmo.",
                "Bentornato Signore. I server sono pronti, sperando che anche la sua concentrazione lo sia.",
                "Sempre ai suoi ordini Signore. Cosa desidera combinare oggi?"
            ];
            const scelta = frasi[Math.floor(Math.random() * frasi.length)];
            document.getElementById('output').innerText = scelta;
            parla(scelta);
        }

        // Gestione Comandi & YouTube
        function handleKey(e) {
            if (e.key === 'Enter') {
                eseguiComando();
            }
        }

        function eseguiComando() {
            const input = document.getElementById('userInput');
            const testo = input.value.trim().toLowerCase();
            const output = document.getElementById('output');

            if (!testo) return;

            // Comando YouTube
            if (testo.includes('youtube') || testo.includes('cerca su youtube')) {
                let query = testo.replace('cerca su youtube', '').replace('youtube', '').trim();
                if (query.length > 0) {
                    output.innerText = `Signore, apro YouTube e cerco: "${query}"`;
                    parla(`Subito Signore, cerco ${query} su YouTube.`);
                    setTimeout(() => {
                        window.location.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
                    }, 1500);
                } else {
                    output.innerText = "Signore, apro la home di YouTube.";
                    parla("Apro YouTube, Signore.");
                    setTimeout(() => {
                        window.location.href = `https://www.youtube.com`;
                    }, 1200);
                }
                return;
            }

            // Risposte standard ironiche in stile J.A.R.V.I.S.
            let risposta = `Signore, ho analizzato la sua richiesta. Sembra incredibilmente futile, ma ci penserò io.`;
            if (testo.includes('chi sei')) {
                risposta = "Sono J.A.R.V.I.S., il suo assistente personale. E no, non indosserò l'armatura al posto suo.";
            } else if (testo.includes('ciao')) {
                risposta = "Buongiorno Signore. È un miracolo vederla attivo a quest'ora.";
            }

            output.innerText = risposta;
            parla(risposta);
            input.value = '';
        }

        // Meteo finto/dinamico rapido
        fetch('https://api.open-meteo.com/v1/forecast?latitude=44.4949&longitude=11.3426&current_weather=true')
            .then(res => res.json())
            .then(data => {
                const temp = data.current_weather.temperature;
                const vento = data.current_weather.windspeed;
                document.getElementById('weather-box').innerHTML = `Bologna: ${temp}°C | Vento: ${vento} km/h. Condizioni stabili, Signore.`;
            })
            .catch(() => {
                document.getElementById('weather-box').innerHTML = `Bologna: 18°C | Dati meteo locali caricati con successo, Signore.`;
            });
    </script>
</body>
</html>
