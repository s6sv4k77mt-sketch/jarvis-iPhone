<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Executive Intelligence Core</title>
    <style>
        :root {
            --primary-color: #00e5ff;
            --bg-color: #02050b;
            --glow-color: rgba(0, 229, 255, 0.5);
        }
        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            transition: background-color 0.4s, color 0.4s;
        }
        #unlock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }
        .unlock-btn {
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 15px 25px;
            font-size: 1rem;
            font-family: monospace;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--glow-color);
            margin-top: 20px;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--primary-color);
            margin: 5px 0;
        }
        .status {
            font-size: 0.65rem;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        .neural-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
        }
        .neural-core {
            width: 120px;
            height: 120px;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--primary-color), inset 0 0 20px var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(0,229,255,0.3) 0%, #000 85%);
            animation: pulseNet 2.5s infinite alternate ease-in-out;
            transition: transform 0.3s ease;
        }
        .core-inner {
            width: 40px;
            height: 40px;
            background-color: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 25px var(--primary-color);
        }
        .neural-core.speaking {
            transform: scale(1.35);
            box-shadow: 0 0 50px var(--primary-color), inset 0 0 35px var(--primary-color);
        }
        @keyframes pulseNet {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }
        .terminal {
            width: 100%;
            max-width: 420px;
            background: rgba(0, 10, 25, 0.9);
            border: 1px solid var(--primary-color);
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 0 15px var(--glow-color);
            font-size: 0.75rem;
            min-height: 70px;
            max-height: 120px;
            overflow-y: auto;
            text-align: center;
            box-sizing: border-box;
            line-height: 1.35;
        }
        .mic-status {
            margin-top: 10px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: #00ff66;
            text-shadow: 0 0 8px rgba(0,255,102,0.6);
        }
    </style>
</head>
<body>

    <div id="unlock-screen">
        <h1>J.A.R.V.I.S. - EXECUTIVE CORE</h1>
        <p style="font-size: 0.75rem; max-width: 320px; opacity: 0.8;">Tocca per sbloccare l'interfaccia neurale e sincronizzare i sistemi di analisi avanzata, Signore.</p>
        <button class="unlock-btn" onclick="inizializzaSistema()">ATTIVA SISTEMA</button>
    </div>

    <h1>J.A.R.V.I.S.</h1>
    <div class="status" id="battery-status">STATUS: ANALISI ENERGIA...</div>

    <div class="neural-container">
        <div class="neural-core" id="neuralCore">
            <div class="core-inner"></div>
        </div>
    </div>

    <div class="terminal" id="output">
        In attesa di comandi direttivi o query operative, Signore...
    </div>

    <div class="mic-status">🎙️ ASCOLTO VOCALE CONTINUO ATTIVO</div>

    <script>
        let livelloBatteria = 100;
        let meteoTesto = "Dati meteo non disponibili";
        let voceSelezionata = null;

        // Ricerca e configurazione della voce italiana più naturale
        function caricaVociUmane() {
            if ('speechSynthesis' in window) {
                const voci = window.speechSynthesis.getVoices();
                voceSelezionata = voci.find(v => v.lang.startsWith('it') && (v.name.includes('Siri') || v.name.includes('Enhanced') || v.name.includes('Natural') || v.name.includes('Alice') || v.name.includes('Paolo'))) 
                               || voci.find(v => v.lang.startsWith('it'));
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = caricaVociUmane;
            caricaVociUmane();
        }

        // Monitoraggio Batteria
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                updateBatteryUI(battery);
                battery.addEventListener('levelchange', function() { updateBatteryUI(battery); });
            });
        }

        function updateBatteryUI(battery) {
            livelloBatteria = Math.floor(battery.level * 100);
            const statusEl = document.getElementById('battery-status');
            const root = document.documentElement;

            if (livelloBatteria < 20) {
                root.style.setProperty('--primary-color', '#ff3333');
                root.style.setProperty('--bg-color', '#1a0000');
                statusEl.innerHTML = `⚠️ EMERGENZA: BATTERIA CRITICA AL ${livelloBatteria}%`;
            } else if (livelloBatteria < 40) {
                root.style.setProperty('--primary-color', '#ff9900');
                root.style.setProperty('--bg-color', '#1a0f00');
                statusEl.innerHTML = `⚠️ ATTENZIONE: BATTERIA AL ${livelloBatteria}%`;
            } else {
                root.style.setProperty('--primary-color', '#00e5ff');
                root.style.setProperty('--bg-color', '#02050b');
                statusEl.innerHTML = `ENERGIA STABILE: ${livelloBatteria}% (ONLINE)`;
            }
        }

        // Sintesi Vocale Intelligente e Fluida
        function parlaJarvis(testo, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(testo);
                utterance.lang = 'it-IT';
                utterance.rate = 1.0; 
                utterance.pitch = 0.95; 

                if (voceSelezionata) {
                    utterance.voice = voceSelezionata;
                }

                const core = document.getElementById('neuralCore');
                const output = document.getElementById('output');

                output.innerText = testo;

                utterance.onstart = function() {
                    core.classList.add('speaking');
                };

                utterance.onend = function() {
                    core.classList.remove('speaking');
                    if (callback) callback();
                };

                window.speechSynthesis.speak(utterance);
            } else if (callback) {
                callback();
            }
        }

        function aggiornaMeteo() {
            fetch('https://api.open-meteo.com/v1/forecast?latitude=44.4949&longitude=11.3426&current_weather=true')
                .then(res => res.json())
                .then(data => {
                    const temp = Math.round(data.current_weather.temperature);
                    meteoTesto = `a Bologna ci sono attualmente ${temp} gradi`;
                })
                .catch(() => {
                    meteoTesto = "impossibile collegarsi al servizio meteo locale";
                });
        }

        function inizializzaSistema() {
            document.getElementById('unlock-screen').style.display = 'none';
            caricaVociUmane();
            aggiornaMeteo();

            const testUtterance = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(testUtterance);

            parlaJarvis("Buonasera, Signore. Tutti i moduli analitici e la rete neurale sono operativi. In attesa delle sue istruzioni.");
            avviaRiconoscimentoVocale();
        }

        // Riconoscimento Vocale Continuo Automatico
        function avviaRiconoscimentoVocale() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Il tuo browser non supporta il riconoscimento vocale, Signore.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.interimResults = false;
            recognition.continuous = true;

            recognition.onresult = function(event) {
                const comando = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                elaboraComandoSuperIntelligente(comando);
            };

            recognition.onend = function() {
                try { recognition.start(); } catch (e) {}
            };

            try { recognition.start(); } catch (e) {}
        }

        // Elaborazione avanzata dei comandi stile video TikTok
        function elaboraComandoSuperIntelligente(comando) {
            const ora = new Date();
            const oraStr = ora.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
            const dataStr = ora.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });

            // 1. Report Completo dell'Agenzia (Ispirato direttamente al video)
            if (comando.includes('agenzia') || comando.includes('recap') || comando.includes('resoconto') || comando.includes('report') || comando.includes('business')) {
                parlaJarvis(`Buonasera Signore. Estraggo subito le metriche chiave dell'agenzia: negli ultimi 7 giorni abbiamo acquisito 4 nuovi clienti, generando 11.500 dollari di nuovi ricavi mensili ricorrenti. La community su Discord è salita a 847 membri attivi. Ieri la nostra rete di prospezione ha individuato 23 nuovi contatti. Ho preparato 18 email personalizzate su Telegram: ne ha inviate 11, ottenendo 4 risposte e 1 appuntamento confermato in calendario per domani alle 10. Sul fronte ADS, ha speso 487 dollari con un ROAS di 3.8. Ho inoltre messo in pausa le campagne carosello meno performanti. Tutto procede a gonfie vele, Signore!`);
            }
            // 2. Controllo Meteo
            else if (comando.includes('meteo') || comando.includes('tempo') || comando.includes('temperatura')) {
                parlaJarvis(`Signore, ${meteoTesto}. Le condizioni esterne sono costantemente monitorate.`);
            } 
            // 3. Controllo Data e Ora
            else if (comando.includes('ora') || comando.includes('ore') || comando.includes('data') || comando.includes('giorno')) {
                parlaJarvis(`Signore, oggi è ${dataStr} e sono esattamente le ${oraStr}.`);
            } 
            // 4. Controllo Batteria
            else if (comando.includes('batteria') || comando.includes('carica') || comando.includes('energia')) {
                let msg = `Signore, l'alimentazione del dispositivo è al ${livelloBatteria} percento.`;
                if (livelloBatteria < 20) {
                    msg += " Stato critico: le raccomando di collegare l'alimentatore prima del blackout.";
                } else {
                    msg += " Riserva energetica ottimale.";
                }
                parlaJarvis(msg);
            } 
            // 5. Saluto Follower
            else if (comando.includes('saluta') || comando.includes('follower')) {
                parlaJarvis("Un caloroso benvenuto a tutti i nostri follower! Felici di avervi a bordo in questo viaggio tecnologico.");
            } 
            // 6. Apertura YouTube
            else if (comando.includes('youtube')) {
                parlaJarvis("Apro subito YouTube per lei, Signore.", function() {
                    window.location.href = 'https://www.youtube.com';
                });
            } 
            // 7. Ricerca Web su Google
            else if (comando.includes('cerca') || comando.includes('trova') || comando.includes('google')) {
                let query = comando.replace('cerca su google', '').replace('cerca', '').replace('trova', '').trim();
                if (query.length > 0) {
                    parlaJarvis(`Avvio la ricerca web per ${query}, Signore.`, function() {
                        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                    });
                } else {
                    parlaJarvis("Quale argomento desidera che analizzi sul web, Signore?");
                }
            } 
            // Risposta generica da assistente di livello executive
            else {
                parlaJarvis(`Ho registrato la sua richiesta: "${comando}". I sistemi rimangono a sua completa disposizione, Signore.`);
            }
        }
    </script>
</body>
</html>
