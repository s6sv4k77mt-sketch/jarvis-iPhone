<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Core</title>
    <style>
        :root {
            --primary-color: #00e5ff;
            --bg-color: #030813;
            --glow-color: rgba(0, 229, 255, 0.6);
        }
        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.4s, color 0.4s;
        }
        h1 {
            font-size: 1.4rem;
            text-align: center;
            letter-spacing: 3px;
            text-shadow: 0 0 12px var(--primary-color);
            margin-bottom: 2px;
        }
        .status {
            font-size: 0.75rem;
            opacity: 0.85;
            margin-bottom: 10px;
            text-align: center;
        }
        /* Sfera Olografica 3D che cambia dimensione */
        .sphere-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .sphere {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, var(--primary-color) 0%, #000 80%);
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 25px var(--primary-color), inset 0 0 20px var(--primary-color);
            transition: transform 0.25s ease-in-out, box-shadow 0.25s ease-in-out;
            animation: pulseGlow 2.5s infinite alternate ease-in-out;
        }
        .sphere.speaking {
            transform: scale(1.35);
            box-shadow: 0 0 45px var(--primary-color), inset 0 0 35px var(--primary-color);
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.92); opacity: 0.8; }
            100% { transform: scale(1.08); opacity: 1; }
        }
        .audio-unlock {
            background: var(--primary-color);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 0 10px var(--primary-color);
        }
        .terminal {
            width: 100%;
            max-width: 400px;
            background: rgba(0, 10, 25, 0.9);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 15px var(--glow-color);
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        #output {
            font-size: 0.85rem;
            min-height: 45px;
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .input-box {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            background: #000;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        button.action-btn {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        button.action-btn:active {
            background: var(--primary-color);
            color: #000;
        }
        .section-title {
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-top: 10px;
            margin-bottom: 5px;
            border-bottom: 1px dashed var(--primary-color);
            width: 100%;
            max-width: 400px;
            padding-bottom: 3px;
        }
    </style>
</head>
<body>

    <h1>J.A.R.V.I.S.</h1>
    <div class="status" id="battery-status">STATUS: RILEVAMENTO ENERGIA...</div>

    <!-- Pulsante obbligatorio per sbloccare l'audio su iOS -->
    <button class="audio-unlock" onclick="attivaAudioForzato()">🔊 CLICCA QUI PER SBLOCCARE VOCE</button>

    <!-- Sfera Olografica 3D -->
    <div class="sphere-container" onclick="faiParlareJarvis()">
        <div class="sphere" id="holoSphere"></div>
    </div>

    <div class="terminal">
        <div id="output">Signore, sistemi operativi e vocali pronti. Tocca la sfera o scrivi un comando.</div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Es. Cerca su YouTube..." onkeypress="handleKey(event)">
            <button class="action-btn" onclick="eseguiComando()">INVIA</button>
        </div>
    </div>

    <div class="section-title">METEO BOLOGNA</div>
    <div class="terminal" id="weather-box" style="font-size: 0.8rem; min-height: auto;">
        Connessione sensori in corso...
    </div>

    <script>
        // Sincronizzazione Batteria Dispositivo e Colori Dinamici
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                updateBatteryUI(battery);
                battery.addEventListener('levelchange', function() { updateBatteryUI(battery); });
            });
        }

        function updateBatteryUI(battery) {
            const level = Math.floor(battery.level * 100);
            const statusEl = document.getElementById('battery-status');
            const root = document.documentElement;

            if (level < 20) {
                root.style.setProperty('--primary-color', '#ff3333');
                root.style.setProperty('--bg-color', '#1a0000');
                root.style.setProperty('--glow-color', 'rgba(255, 51, 51, 0.6)');
                statusEl.innerHTML = `⚠️ EMERGENZA: BATTERIA CRITICA AL ${level}%`;
            } else if (level < 40) {
                root.style.setProperty('--primary-color', '#ff9900');
                root.style.setProperty('--bg-color', '#1a0f00');
                root.style.setProperty('--glow-color', 'rgba(255, 153, 0, 0.6)');
                statusEl.innerHTML = `⚠️ ATTENZIONE: BATTERIA AL ${level}%`;
            } else {
                root.style.setProperty('--primary-color', '#00e5ff');
                root.style.setProperty('--bg-color', '#030813');
                root.style.setProperty('--glow-color', 'rgba(0, 229, 255, 0.6)');
                statusEl.innerHTML = `ENERGIA STABILE: ${level}% (ONLINE)`;
            }
        }

        // Funzione di sblocco audio forzato per Safari/iOS
        function attivaAudioForzato() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("Audio sbloccato. Sistemi operativi attivi, Signore.");
                utterance.lang = 'it-IT';
                window.speechSynthesis.speak(utterance);
                document.getElementById('output').innerText = "Signore, audio sbloccato con successo.";
            }
        }

        // Sintesi Vocale Principale con variazione della Sfera 3D
        function parla(testo) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(testo);
                utterance.lang = 'it-IT';
                utterance.rate = 1.05;

                const sphere = document.getElementById('holoSphere');

                // Quando parla, la sfera si ingrandisce (varia dimensioni)
                utterance.onstart = function() {
                    sphere.classList.add('speaking');
                };

                utterance.onend = function() {
                    sphere.classList.remove('speaking');
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        function faiParlareJarvis() {
            const frasi = [
                "Signore, toccare la mia sfera olografica non velocizzerà i suoi impegni.",
                "Sempre ai suoi ordini Signore. Che c'è di nuovo?",
                "I sistemi rispondono perfettamente, Signore. A differenza della sua pazienza."
            ];
            const scelta = frasi[Math.floor(Math.random() * frasi.length)];
            document.getElementById('output').innerText = scelta;
            parla(scelta);
        }

        function handleKey(e) {
            if (e.key === 'Enter') {
                eseguiComando();
            }
        }

        // Gestione Comandi & YouTube
        function eseguiComando() {
            const input = document.getElementById('userInput');
            const testo = input.value.trim().toLowerCase();
            const output = document.getElementById('output');

            if (!testo) return;

            // Comando YouTube
            if (testo.includes('youtube') || testo.includes('cerca su youtube')) {
                let query = testo.replace('cerca su youtube', '').replace('youtube', '').trim();
                if (query.length > 0) {
                    output.innerText = `Signore, apro YouTube per: "${query}"`;
                    parla(`Subito Signore, cerco ${query} su YouTube.`);
                    setTimeout(() => {
                        window.location.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
                    }, 1800);
                } else {
                    output.innerText = "Signore, apro YouTube.";
                    parla("Apro YouTube, Signore.");
                    setTimeout(() => {
                        window.location.href = `https://www.youtube.com`;
                    }, 1500);
                }
                return;
            }

            // Risposte standard ironiche
            let risposta = `Signore, ho elaborato la sua richiesta. Onestamente mi aspettavo di meglio.`;
            if (testo.includes('chi sei')) {
                risposta = "Sono J.A.R.V.I.S., il suo assistente personale. E no, non assemblerò io i componenti per la sua fatbike.";
            } else if (testo.includes('ciao') || testo.includes('salve')) {
                risposta = "Buongiorno Signore. È un miracolo vederla attivo a quest'ora.";
            } else if (testo.includes('batteria')) {
                if ('getBattery' in navigator) {
                    navigator.getBattery().then(b => {
                        const pct = Math.floor(b.level * 100);
                        parla(`Il sistema indica che la sua batteria è al ${pct} percento, Signore.`);
                    });
                    return;
                }
            }

            output.innerText = risposta;
            parla(risposta);
            input.value = '';
        }

        // Meteo Bologna reale
        fetch('https://api.open-meteo.com/v1/forecast?latitude=44.4949&longitude=11.3426&current_weather=true')
            .then(res => res.json())
            .then(data => {
                const temp = data.current_weather.temperature;
                const vento = data.current_weather.windspeed;
                document.getElementById('weather-box').innerHTML = `Bologna: ${temp}°C | Vento: ${vento} km/h. Condizioni stabili, Signore.`;
            })
            .catch(() => {
                document.getElementById('weather-box').innerHTML = `Bologna: Connessione meteo attiva, Signore.`;
            });
    </script>
</body>
</html>
