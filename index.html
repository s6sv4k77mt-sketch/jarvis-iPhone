<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Advanced Neural Core</title>
    <style>
        :root {
            --primary-color: #00e5ff;
            --bg-color: #02050b;
            --glow-color: rgba(0, 229, 255, 0.5);
        }
        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            transition: background-color 0.4s, color 0.4s;
        }
        #unlock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }
        .unlock-btn {
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 15px 25px;
            font-size: 1rem;
            font-family: monospace;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--glow-color);
            margin-top: 20px;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--primary-color);
            margin: 5px 0;
        }
        .status {
            font-size: 0.65rem;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        .neural-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
        }
        .neural-core {
            width: 120px;
            height: 120px;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--primary-color), inset 0 0 20px var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(0,229,255,0.3) 0%, #000 85%);
            animation: pulseNet 2.5s infinite alternate ease-in-out;
            transition: transform 0.3s ease;
        }
        .core-inner {
            width: 40px;
            height: 40px;
            background-color: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 25px var(--primary-color);
        }
        .neural-core.speaking {
            transform: scale(1.35);
            box-shadow: 0 0 50px var(--primary-color), inset 0 0 35px var(--primary-color);
        }
        @keyframes pulseNet {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }
        .terminal {
            width: 100%;
            max-width: 380px;
            background: rgba(0, 10, 25, 0.9);
            border: 1px solid var(--primary-color);
            border-radius: 6px;
            padding: 10px;
            box-shadow: 0 0 15px var(--glow-color);
            font-size: 0.75rem;
            min-height: 60px;
            max-height: 90px;
            overflow-y: auto;
            text-align: center;
            box-sizing: border-box;
            line-height: 1.3;
        }
        .mic-status {
            margin-top: 10px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: #00ff66;
            text-shadow: 0 0 8px rgba(0,255,102,0.6);
        }
    </style>
</head>
<body>

    <div id="unlock-screen">
        <h1>J.A.R.V.I.S. - HUD ADVANCED</h1>
        <p style="font-size: 0.75rem; max-width: 300px; opacity: 0.8;">Tocca per sbloccare l'audio neurale e attivare le funzioni avanzate, Signore.</p>
        <button class="unlock-btn" onclick="inizializzaSistema()">ATTIVA SISTEMA</button>
    </div>

    <h1>J.A.R.V.I.S.</h1>
    <div class="status" id="battery-status">STATUS: ANALISI ENERGIA...</div>

    <div class="neural-container">
        <div class="neural-core" id="neuralCore">
            <div class="core-inner"></div>
        </div>
    </div>

    <div class="terminal" id="output">
        In attesa dei suoi comandi vocali, Signore...
    </div>

    <div class="mic-status">🎙️ ASCOLTO VOCALE CONTINUO ATTIVO</div>

    <script>
        let livelloBatteria = 100;
        let meteoTesto = "Dati meteo momentaneamente non disponibili";
        let voceSelezionata = null;

        // Selezione della voce naturale/umana in italiano
        function caricaVociUmane() {
            if ('speechSynthesis' in window) {
                const voci = window.speechSynthesis.getVoices();
                voceSelezionata = voci.find(v => v.lang.startsWith('it') && (v.name.includes('Siri') || v.name.includes('Enhanced') || v.name.includes('Natural') || v.name.includes('Alice') || v.name.includes('Paolo'))) 
                               || voci.find(v => v.lang.startsWith('it'));
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = caricaVociUmane;
            caricaVociUmane();
        }

        // Monitoraggio Batteria in tempo reale
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                updateBatteryUI(battery);
                battery.addEventListener('levelchange', function() { updateBatteryUI(battery); });
            });
        }

        function updateBatteryUI(battery) {
            livelloBatteria = Math.floor(battery.level * 100);
            const statusEl = document.getElementById('battery-status');
            const root = document.documentElement;

            if (livelloBatteria < 20) {
                root.style.setProperty('--primary-color', '#ff3333');
                root.style.setProperty('--bg-color', '#1a0000');
                statusEl.innerHTML = `⚠️ EMERGENZA: BATTERIA CRITICA AL ${livelloBatteria}%`;
            } else if (livelloBatteria < 40) {
                root.style.setProperty('--primary-color', '#ff9900');
                root.style.setProperty('--bg-color', '#1a0f00');
                statusEl.innerHTML = `⚠️ ATTENZIONE: BATTERIA AL ${livelloBatteria}%`;
            } else {
                root.style.setProperty('--primary-color', '#00e5ff');
                root.style.setProperty('--bg-color', '#02050b');
                statusEl.innerHTML = `ENERGIA STABILE: ${livelloBatteria}% (ONLINE)`;
            }
        }

        // Sintesi vocale dinamica e naturale
        function parlaJarvis(testo, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(testo);
                utterance.lang = 'it-IT';
                utterance.rate = 1.0;
                utterance.pitch = 0.95;

                if (voceSelezionata) {
                    utterance.voice = voceSelezionata;
                }

                const core = document.getElementById('neuralCore');
                const output = document.getElementById('output');

                output.innerText = testo;

                utterance.onstart = function() {
                    core.classList.add('speaking');
                };

                utterance.onend = function() {
                    core.classList.remove('speaking');
                    if (callback) callback();
                };

                window.speechSynthesis.speak(utterance);
            } else if (callback) {
                callback();
            }
        }

        // Recupero Meteo Bologna
        function aggiornaMeteo() {
            fetch('https://api.open-meteo.com/v1/forecast?latitude=44.4949&longitude=11.3426&current_weather=true')
                .then(res => res.json())
                .then(data => {
                    const temp = Math.round(data.current_weather.temperature);
                    meteoTesto = `a Bologna ci sono attualmente ${temp} gradi`;
                })
                .catch(() => {
                    meteoTesto = "non sono riuscito a contattare i satelliti meteo per Bologna";
                });
        }

        function inizializzaSistema() {
            document.getElementById('unlock-screen').style.display = 'none';
            caricaVociUmane();
            aggiornaMeteo();

            const testUtterance = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(testUtterance);

            parlaJarvis("Protocolli avanzati attivati. Sfera olografica online. Bentornato, Signore.");
            avviaRiconoscimentoVocale();
        }

        // Riconoscimento Vocale Continuo Automatico
        function avviaRiconoscimentoVocale() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Il tuo browser non supporta il riconoscimento vocale, Signore.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.interimResults = false;
            recognition.continuous = true;

            recognition.onresult = function(event) {
                const comando = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                elaboraComandoIntelligente(comando);
            };

            recognition.onend = function() {
                try { recognition.start(); } catch (e) {}
            };

            try { recognition.start(); } catch (e) {}
        }

        // Intelligenza e smistamento comandi avanzati
        function elaboraComandoIntelligente(comando) {
            const ora = new Date();
            const oraStr = ora.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
            const dataStr = ora.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });

            // 1. Controllo Meteo
            if (comando.includes('meteo') || comando.includes('tempo') || comando.includes('temperatura')) {
                parlaJarvis(`Signore, ${meteoTesto}. Ti consiglio un controllo visivo diretto se devi uscire.`);
            } 
            // 2. Controllo Data e Ora
            else if (comando.includes('ora') || comando.includes('ore') || comando.includes('data') || comando.includes('giorno')) {
                parlaJarvis(`Signore, oggi è ${dataStr} e sono esattamente le ore ${oraStr}. Il tempo è una risorsa preziosa.`);
            } 
            // 3. Controllo Batteria
            else if (comando.includes('batteria') || comando.includes('carica') || comando.includes('energia')) {
                let msgBatt = `Signore, il sistema energetico segna il ${livelloBatteria} percento di carica.`;
                if (livelloBatteria < 20) {
                    msgBatt += " Attenzione, rischiamo un blackout imminente!";
                } else {
                    msgBatt += " Operatività al massimo delle capacità.";
                }
                parlaJarvis(msgBatt);
            } 
            // 4. Saluto ai follower
            else if (comando.includes('saluta') || comando.includes('follower')) {
                parlaJarvis("Un saluto eccezionale a tutti i nostri follower collegati! Grazie per il supporto costante.");
            } 
            // 5. Apertura YouTube
            else if (comando.includes('youtube')) {
                parlaJarvis("Certamente Signore, apro YouTube in un istante.", function() {
                    window.location.href = 'https://www.youtube.com';
                });
            } 
            // 6. Ricerca Web Dinamica su Google
            else if (comando.includes('cerca') || comando.includes('trova') || comando.includes('google')) {
                let query = comando.replace('cerca su google', '').replace('cerca', '').replace('trova', '').trim();
                if (query.length > 0) {
                    parlaJarvis(`Interrogo i database di ricerca per: ${query}, Signore.`, function() {
                        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                    });
                } else {
                    parlaJarvis("Cosa desideri che trovi sul web, Signore?");
                }
            } 
            // Risposta intelligente generica
            else {
                parlaJarvis(`Comando "${comando}" memorizzato e compreso. Al tuo servizio, Signore.`);
            }
        }
    </script>
</body>
</html>
