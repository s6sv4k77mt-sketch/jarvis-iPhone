<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Floating Sphere Core</title>
    <style>
        :root {
            --primary-color: #00e5ff;
            --bg-color: #030813;
            --glow-color: rgba(0, 229, 255, 0.6);
        }
        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
            transition: background-color 0.4s, color 0.4s;
        }
        h1 {
            font-size: 1.3rem;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary-color);
            margin-bottom: 2px;
            z-index: 10;
        }
        .status {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-bottom: 10px;
            text-align: center;
            z-index: 10;
        }
        /* Tasto ON/OFF Microfono */
        .mic-toggle-btn {
            background: rgba(0, 229, 255, 0.15);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 8px 14px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 0 15px var(--glow-color);
            font-size: 0.8rem;
            z-index: 10;
            transition: 0.3s;
        }
        .mic-toggle-btn.active {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 25px var(--primary-color);
        }
        /* Sfera Olografica che "giranzola" fluttuando */
        .floating-sphere-area {
            position: relative;
            width: 100%;
            height: 200px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        .reactor {
            width: 100px;
            height: 100px;
            border: 3px solid var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 25px var(--primary-color), inset 0 0 20px var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            background: radial-gradient(circle at 35% 35%, rgba(0,229,255,0.4) 0%, #000 80%);
            animation: floatOrbiter 6s infinite ease-in-out, pulseGlow 2s infinite alternate ease-in-out;
            transition: transform 0.3s ease;
        }
        .core {
            width: 35px;
            height: 35px;
            background-color: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 25px var(--primary-color);
        }
        .reactor.speaking {
            transform: scale(1.35) !important;
            box-shadow: 0 0 50px var(--primary-color), inset 0 0 35px var(--primary-color);
        }
        /* Animazione di movimento casuale/orbita nello spazio */
        @keyframes floatOrbiter {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            25% { transform: translate(50px, -20px) rotate(90deg); }
            50% { transform: translate(0px, 15px) rotate(180deg); }
            75% { transform: translate(-50px, -15px) rotate(270deg); }
            100% { transform: translate(0px, 0px) rotate(360deg); }
        }
        @keyframes pulseGlow {
            0% { opacity: 0.85; }
            100% { opacity: 1; }
        }
        .terminal {
            width: 100%;
            max-width: 400px;
            background: rgba(0, 10, 25, 0.85);
            border: 1px solid var(--primary-color);
            border-radius: 6px;
            padding: 10px;
            box-shadow: 0 0 15px var(--glow-color);
            margin-bottom: 12px;
            z-index: 10;
            box-sizing: border-box;
        }
        #output {
            font-size: 0.8rem;
            min-height: 40px;
            max-height: 90px;
            overflow-y: auto;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .input-box {
            display: flex;
            gap: 6px;
        }
        input[type="text"] {
            flex: 1;
            background: #000;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .action-row {
            display: flex;
            gap: 6px;
            z-index: 10;
        }
        button.action-btn {
            flex: 1;
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.8rem;
            text-align: center;
        }
        button.action-btn:active {
            background: var(--primary-color);
            color: #000;
        }
        .section-title {
            font-size: 0.75rem;
            letter-spacing: 1px;
            margin-top: 8px;
            margin-bottom: 4px;
            border-bottom: 1px dashed var(--primary-color);
            width: 100%;
            max-width: 400px;
            padding-bottom: 2px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1>J.A.R.V.I.S.</h1>
    <div class="status" id="battery-status">STATUS: ANALISI ENERGIA...</div>

    <!-- Tasto Microfono Continuo ON/OFF -->
    <button class="mic-toggle-btn" id="micToggleBtn" onclick="toggleAscoltoContinuo()">🎙️ MICROFONO: DISATTIVATO</button>

    <!-- Area in cui la sfera "giranzola" fluttuando -->
    <div class="floating-sphere-area">
        <div class="reactor" id="holoReactor">
            <div class="core"></div>
        </div>
    </div>

    <div class="terminal">
        <div id="output">Signore, la sfera olografica è online e fluttua. Attiva il microfono o scrivi.</div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Scrivi un comando..." onkeypress="handleKey(event)">
            <button class="action-btn" style="flex:0 0 auto;" onclick="eseguiComandoTesto()">INVIA</button>
        </div>
    </div>

    <div class="action-row" style="width: 100%; max-width: 400px; margin-bottom: 12px;">
        <button class="action-btn" onclick="eseguiComandoEsecutivo('follower')">Saluta follower</button>
        <button class="action-btn" onclick="eseguiComandoEsecutivo('youtube')">YouTube</button>
    </div>

    <div class="section-title">METEO BOLOGNA</div>
    <div class="terminal" id="weather-box" style="font-size: 0.75rem; min-height: auto; z-index: 10;">
        Caricamento dati...
    </div>

    <script>
        // Sincronizzazione Batteria e Colori Dinamici
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                updateBatteryUI(battery);
                battery.addEventListener('levelchange', function() { updateBatteryUI(battery); });
            });
        }

        function updateBatteryUI(battery) {
            const level = Math.floor(battery.level * 100);
            const statusEl = document.getElementById('battery-status');
            const root = document.documentElement;

            if (level < 20) {
                root.style.setProperty('--primary-color', '#ff3333');
                root.style.setProperty('--bg-color', '#1a0000');
                statusEl.innerHTML = `⚠️ EMERGENZA: BATTERIA CRITICA AL ${level}%`;
            } else if (level < 40) {
                root.style.setProperty('--primary-color', '#ff9900');
                root.style.setProperty('--bg-color', '#1a0f00');
                statusEl.innerHTML = `⚠️ ATTENZIONE: BATTERIA AL ${level}%`;
            } else {
                root.style.setProperty('--primary-color', '#00e5ff');
                root.style.setProperty('--bg-color', '#030813');
                statusEl.innerHTML = `ENERGIA STABILE: ${level}% (ONLINE)`;
            }
        }

        // Gestione Audio MP3 e ingrandimento della sfera fluttuante
        let attualAudio = null;
        function riproduciAudio(fileMp3, testoOutput, callback) {
            if (attualAudio) {
                attualAudio.pause();
                attualAudio.currentTime = 0;
            }

            const reactor = document.getElementById('holoReactor');
            const output = document.getElementById('output');

            if (testoOutput) {
                output.innerText = testoOutput;
            }

            attualAudio = new Audio(fileMp3);
            reactor.classList.add('speaking'); // Ingrandisce la sfera mentre parla

            attualAudio.play().catch(err => {
                console.log("Errore audio:", err);
                reactor.classList.remove('speaking');
            });

            attualAudio.onended = function() {
                reactor.classList.remove('speaking');
                if (callback) callback();
            };
        }

        // Ascolto Continuo ON / OFF
        let recognition = null;
        let ascoltoAttivo = false;

        function toggleAscoltoContinuo() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Il tuo browser non supporta il riconoscimento vocale continuo, Signore.");
                return;
            }

            const btn = document.getElementById('micToggleBtn');

            if (!ascoltoAttivo) {
                ascoltoAttivo = true;
                btn.classList.add('active');
                btn.innerText = "🔴 MICROFONO: ATTIVO (IN ASCOLTO)";
                avviaRiconoscimentoContinuo();
                riproduciAudio('avvio.mp3', 'Sistemi di ascolto continuo attivi, Signore.');
            } else {
                ascoltoAttivo = false;
                btn.classList.remove('active');
                btn.innerText = "🎙️ MICROFONO: DISATTIVATO";
                if (recognition) {
                    recognition.stop();
                }
                document.getElementById('output').innerText = "Microfono disattivato, Signore.";
            }
        }

        function avviaRiconoscimentoContinuo() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.interimResults = false;
            recognition.continuous = true;

            recognition.onresult = function(event) {
                const speechResult = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                document.getElementById('userInput').value = speechResult;
                elaboraTestoRicevuto(speechResult);
            };

            recognition.onerror = function(event) {
                console.log("Errore riconoscimento vocale:", event.error);
            };

            recognition.onend = function() {
                if (ascoltoAttivo) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.log("Riavvio microfono in corso...");
                    }
                }
            };

            try {
                recognition.start();
            } catch (e) {
                console.log("Riconoscimento già avviato");
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter') {
                eseguiComandoTesto();
            }
        }

        function eseguiComandoEsecutivo(tipo) {
            if (tipo === 'follower') {
                riproduciAudio('follower.mp3', 'Ciao a tutti, benvenuti! Grazie per averci seguito, siamo felici di avervi con noi.');
            } else if (tipo === 'youtube') {
                riproduciAudio('youtube.mp3', 'Signore, apro YouTube.', function() {
                    window.location.href = 'https://www.youtube.com';
                });
            }
        }

        function eseguiComandoTesto() {
            const input = document.getElementById('userInput');
            const testo = input.value.trim().toLowerCase();
            if (!testo) return;
            elaboraTestoRicevuto(testo);
            input.value = '';
        }

        function elaboraTestoRicevuto(testo) {
            if (testo.includes('youtube')) {
                eseguiComandoEsecutivo('youtube');
            } else if (testo.includes('saluta') || testo.includes('follower')) {
                eseguiComandoEsecutivo('follower');
            } else {
                riproduciAudio('interazione.mp3', `Comando ricevuto: "${testo}". Signore, eseguo.`);
            }
        }

        // Meteo Bologna
        fetch('https://api.open-meteo.com/v1/forecast?latitude=44.4949&longitude=11.3426&current_weather=true')
            .then(res => res.json())
            .then(data => {
                const temp = data.current_weather.temperature;
                const vento = data.current_weather.windspeed;
                document.getElementById('weather-box').innerHTML = `Bologna: ${temp}°C | Vento: ${vento} km/h. Online, Signore.`;
            })
            .catch(() => {
                document.getElementById('weather-box').innerHTML = `Bologna: Connessione attiva, Signore.`;
            });
    </script>
</body>
</html>
